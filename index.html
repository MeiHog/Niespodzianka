<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨Sprawdź co twój Janek ma ci dzisiaj do powiedzenia</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f5ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 400px;
      text-align: center;
      transition: transform 0.25s ease;
    }
    .card:hover { transform: translateY(-6px); }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:disabled {
      background: #c4b5fd;
      cursor: default;
    }
    button:hover:enabled {
      background: #6d28d9;
    }
    .fade-in {
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    #timer {
      margin-top: 10px;
      font-size: 14px;
      color: #6b21a8;
    }
    .small-note { font-size: 13px; color: #6b21a8; margin-top:8px }
  </style>
</head>
<body>
  <div class="card" role="main">
    <h2>✨Sprawdź co twój Janek ma ci dzisiaj do powiedzenia✨</h2>
    <p id="output">Kliknij przycisk poniżej 💜</p>
    <button id="losujBtn">Losuj</button>
    <!-- timer zostanie dodany dynamicznie -->
  </div>

  <script>
    (function () {
      const teksty = [
        "Jesteś najpiękniejszą osobą, jaką znam ",
        "Twój uśmiech potrafi odmienić cały mój dzień ",
        "Jesteś dla mnie ogromnie ważna ",
        "Dziękuję, że jesteś w moim życiu ",
        "Kocham Cię bardziej, niż potrafię to powiedzieć ",
        "Jesteś moim ulubionym człowiekiem na świecie ",
        "Twoja obecność sprawia, że wszystko jest lepsze ",
        "Jesteś cudowna dokładnie taka, jaka jesteś ",
        "Nikt nigdy nie dawał mi tyle szczęścia co ty",
        "Kocham Cię bardziej, niż potrafię to powiedzieć.",
"Jesteś moim ulubionym miejscem na świecie.",
"Dziękuję, że jesteś — z Tobą wszystko ma sens.",
"Twoje oczy mają w sobie coś, co uspokaja cały mój dzień.",
"Jesteś najpiękniejszą częścią mojego życia.",
"Kiedy myślę o szczęściu, widzę Ciebie.",
"Twoja obecność sprawia, że zwykły dzień staje się wyjątkowy.",
"Zasługujesz na wszystko, co najlepsze, i jeszcze więcej.",
"Jesteś kimś, o kogo warto dbać każdego dnia.",
"Twoje ciepło potrafi stopić każdy mój stres.",
"Nie ma takiej chwili, żebym nie był wdzięczny za Ciebie.",
"Jesteś moją codzienną dawką motywacji.",
"Masz w sobie magię, której nie da się opisać.",
"Z Tobą nawet cisza jest piękna.",
"Jesteś moją najważniejszą osobą.",
"Co dzień kocham Cię trochę bardziej — i to piękne.",
"Nie musisz być perfekcyjna. Dla mnie już jesteś idealna.",
"Twoje serce jest miejscem, w którym mógłbym zamieszkać na zawsze.",
"Każda minuta z Tobą sprawia, że chcę kolejnej, i kolejnej, i kolejnej.",
"Kiedy mnie dotykasz, cały świat zaczyna brzmieć inaczej — piękniej.",
"Gdy patrzę na Ciebie, czuję, że znalazłem coś, czego nie chcę nigdy zgubić.",
"Jesteś moją ulubioną częścią każdego dnia, nawet jeśli w nim nie jesteś.",
"Twoja miłość to najładniejsza rzecz, jaka mi się kiedykolwiek przydarzyła.",
"Każde Twoje spojrzenie zostawia w moim sercu ślad, który uwielbiam.",
"Kocham cię najmocniej na świecie",
"Jesteś jedną z najpiękniejszych rzeczy, jakie spotkały mnie w życiu.",
"Twoje serce ma w sobie tyle ciepła, że potrafi rozjaśnić nawet mój najgorszy dzień.",
"Z Tobą obok czuję, że mogę wszystko.",
"Każda chwila z Tobą przypomina mi, jak bardzo mam szczęście.",
"Twoje spojrzenie potrafi uspokoić mnie lepiej niż cokolwiek innego.",
"Jesteś dla mnie kimś absolutnie wyjątkowym nieporównywalnym z nikim innym.",
"Twoja bliskość sprawia, że świat staje się prostszy, a ja spokojniejszy.",
"Nie mogę przestać podziwiać, jak piękną osobą jesteś we wszystkim.",
"Przy Tobie czuję się dokładnie tam, gdzie powinienem być.",
"Twoja delikatność i siła jednocześnie zachwycają mnie każdego dnia.",
"Jesteś powodem, dla którego chce mi się codziennie bardziej starać.",
"Twoje istnienie samo w sobie jest dla mnie największym darem.",
"Nie musisz nic robić — sama Twoja obecność sprawia, że jestem szczęśliwy.",
"Jesteś dla mnie bezpiecznym miejscem i najpiękniejszą codziennością.",
"To, że Cię mam, jest czymś, za co jestem wdzięczny każdego dnia.",
"Kocham cię bardziej niż tezie",
"Nie ma nic lepszego na koniec dnia od spotkania z tobą.",
"Dobrze, że oboje wiemy, kiedy żartujemy, bo inaczej byłoby dość nie ciekawie…",
"Czuję olbrzymi spokój, gdy jestem w twoich ramionach.",
"Wszystkie motocykle przy tobie to chuj."


      ];

      const output = document.getElementById("output");
      const button = document.getElementById("losujBtn");
      let timerInterval = null;
      let timerElem = null;

      function showText(text, withNote) {
        // Używamy innerHTML, by móc dodać <br>, ale wstawiany tekst pochodzi z zaufanego źródła
        if (withNote) {
          output.innerHTML = escapeHtml(text) + '<br><span class="small-note">(Następne losowanie jutro)</span>';
        } else {
          output.textContent = text;
        }
        output.classList.add('fade-in');
        // usuń klasę po animacji, żeby można ją ponownie dodać później
        setTimeout(() => output.classList.remove('fade-in'), 700);
      }

      function escapeHtml(str) {
        return str.replace(/[&<>\"']/g, function (c) {
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c];
        });
      }

      function losuj() {
        const los = Math.floor(Math.random() * teksty.length);
        const today = new Date().toDateString();
        localStorage.setItem("lastDate", today);
        localStorage.setItem("lastText", teksty[los]);

        showText(teksty[los], true);
        button.disabled = true;
        button.textContent = "Dostępne jutro";
        startCountdown();
      }

      function startCountdown() {
        // jeśli timer już działa, nie tworzymy kolejnego
        if (timerInterval) return;

        if (!timerElem) {
          timerElem = document.createElement('div');
          timerElem.id = 'timer';
          document.querySelector('.card').appendChild(timerElem);
        }

        function update() {
          const now = new Date();
          const nextMidnight = new Date();
          nextMidnight.setHours(24, 0, 0, 0);
          const diff = nextMidnight - now;

          if (diff <= 0) {
            // koniec okresu — przestań odliczać
            clearInterval(timerInterval);
            timerInterval = null;
            timerElem.textContent = '';
            // pozwól na ponowne losowanie po odświeżeniu strony
            return;
          }

          const h = Math.floor(diff / 1000 / 60 / 60);
          const m = Math.floor((diff / 1000 / 60) % 60);
          const s = Math.floor((diff / 1000) % 60);

          timerElem.textContent = `Nowe losowanie za: ${h}h ${m}m ${s}s`;
        }

        update();
        timerInterval = setInterval(update, 1000);
      }

      // Inicjalizacja po załadowaniu strony
      window.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toDateString();
        const lastDate = localStorage.getItem("lastDate");
        const lastText = localStorage.getItem("lastText");

        if (lastDate === today && lastText) {
          showText(lastText, true);
          button.disabled = true;
          button.textContent = "Dostępne jutro";
          startCountdown();
        } else {
          showText('Kliknij przycisk, aby wylosować dzisiejsze zdanie 💜', false);
          button.disabled = false;
          button.textContent = 'Losuj';
        }
      });

      // Obsługa kliknięcia
      button.addEventListener('click', () => {
        // dodatkowe zabezpieczenie
        if (button.disabled) return;
        losuj();
      });

    })();
  </script>
</body>
</html>
